# Jehydro Meet — Frontend Virtual Host
# Routes: https://jehydro.com/meet -> frontend
#         https://meet-api.jehydro.com  -> backend (API + WebSocket)

# -----------------------------------------------------------
# Main domain — serves the Next.js frontend
# -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jehydro.com www.jehydro.com;

    ssl_certificate /etc/letsencrypt/live/jehydro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jehydro.com/privkey.pem;

    # ---- Security headers (additional for main domain) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- Frontend proxy ----
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for long-lived connections (SSE, etc.)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Static assets cache ----
    location /_next/static {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Cache static assets aggressively
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico {
        proxy_pass http://frontend:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=86400";
    }
}

# -----------------------------------------------------------
# API subdomain — serves the backend (REST + WebSocket)
# -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet-api.jehydro.com;

    ssl_certificate /etc/letsencrypt/live/meet-api.jehydro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet-api.jehydro.com/privkey.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- CORS preflight ----
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://jehydro.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "https://jehydro.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # ---- WebSocket endpoint (Socket.IO) ----
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (no timeout for persistent connections)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Socket.IO requires buffering off
        proxy_buffering off;

        # Sticky sessions (set a cookie for Socket.IO affinity)
        # Only needed if running >1 backend instance
        # proxy_set_header Cookie $http_cookie;
        # proxy_set_header X-Forwarded-Host $host;
    }

    # ---- Health check ----
    location /health {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# -----------------------------------------------------------
# HTTP redirects (all traffic -> HTTPS)
# -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jehydro.com www.jehydro.com meet-api.jehydro.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
