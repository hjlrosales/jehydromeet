# Jehydro Meet — Coturn TURN Server Configuration (Production)
# Shared-secret REST auth. TLS on 443/5349 for firewall-friendly operation.
#
# TURN credentials are issued by the backend via HMAC-SHA1 using TURN_SECRET.
# The ${TURN_SECRET} placeholder is substituted at container start by
# docker-entrypoint.sh (sed replacement).
#
# Reference: https://github.com/coturn/coturn/wiki/turnserver

# ---- Listening ports ----
listener-port=3478
tls-listener-port=5349

# ---- Relay port range ----
# Must match docker-compose.yml port mapping
min-port=49152
max-port=65535

# ---- Authentication ----
# Use shared-secret HMAC auth (REST API style)
use-auth-secret
# Substituted at runtime by docker-entrypoint.sh
static-auth-secret=${TURN_SECRET}
# Realm MUST match the domain in TURN_URLS passed to clients
realm=turn.jehydro.com

# ---- TLS ----
cert=/etc/letsencrypt/live/turn.jehydro.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.jehydro.com/privkey.pem

# ---- Performance & security ----
fingerprint
total-quota=100
bps-capacity=0
stale-nonce=600

# ---- Misc ----
# Verbose logging; uncomment for debugging
# verbose

# No CLI password (auth via shared secret only)
no-cli

# Allow loopback dev testing
no-multicast-peers
